<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediBook – Create Account</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <!--  NAVBAR -->
  <nav>
    <a class="logo" href="index.html">
      <div class="logo-icon">+</div>
      MediBook
    </a>
    <div class="nav-links">
      <button class="toggle-btn" id="darkToggle" title="Toggle dark mode">🌙</button>
      <div id="guestNav" style="display:flex; gap:8px;">
        <a href="login.html"    class="nav-btn">Sign In</a>
        <a href="register.html" class="nav-btn primary">Register</a>
      </div>
      <div id="userNav" style="display:none; align-items:center; gap:10px;">
        <a href="index.html"        class="nav-btn">Find Doctors</a>
        <a href="appointments.html" class="nav-btn">My Appointments</a>
        <div class="user-menu">
          <div class="user-avatar" id="userAvatarBtn" onclick="toggleDropdown()">JD</div>
          <div class="user-dropdown" id="userDropdown">
            <a href="appointments.html" class="dd-item">📅 Appointments</a>
            <div class="dd-item danger" onclick="signOut()">🚪 Sign Out</div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!--  REGISTER FORM  -->
  <div class="auth-page">
    <div class="form-wrap">

      <div class="form-title">
        <span class="form-logo">🏥</span>
        <h2>Create Account</h2>
        <p>Join thousands of patients on MediBook</p>
      </div>

      <!-- Alert Box -->
      <div class="alert" id="registerAlert"></div>

      <!-- Register Form -->
      <form onsubmit="doRegister(event)">
        <div class="form-group">
          <label for="regName">Full Name <span style="color:var(--red)">*</span></label>
          <input
            type="text"
            id="regName"
            placeholder="John Doe"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address <span style="color:var(--red)">*</span></label>
          <input
            type="email"
            id="regEmail"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="regPass">Password <span style="color:var(--red)">*</span></label>
          <input
            type="password"
            id="regPass"
            placeholder="Min. 8 characters"
            autocomplete="new-password"
            oninput="checkPasswordStrength(this.value)"
            required
          />
          <!-- Password Strength Indicator -->
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
        <div class="form-group">
          <label for="regPass">Password <span style="color:var(--red)">*</span></label>
          <input
            type="password"
            id="regPass"
            placeholder="Min. 8 characters"
            autocomplete="new-password"
            oninput="checkPasswordStrength(this.value)"
            required
          />
          <!-- Password Strength Indicator -->
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <div class="form-group">
          <label for="regPhone">Phone Number</label>
          <input
            type="tel"
            id="regPhone"
            placeholder="+1 234 567 8900"
            autocomplete="tel"
          />
        </div>

        <div class="form-group">
          <label for="regDob">Date of Birth</label>
          <input
            type="date"
            id="regDob"
            max=""
          />
        </div>

        <div class="form-group">
          <label for="regGender">Gender</label>
          <select id="regGender">
            <option value="">-- Select --</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other / Prefer not to say</option>
          </select>
        </div>

        <button type="submit" class="btn full">Create Account</button>
      </form>

      <hr class="divider" />

      <div class="form-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
      <div class="form-switch mt-8">
        <a href="index.html">← Back to Home</a>
      </div>

    </div>
  </div>

  <!-- TOAST-->
  <div class="toast" id="toast"></div>

  <!--  SCRIPTS  -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Set max date of birth to today
    document.getElementById('regDob').max = new Date().toISOString().split('T')[0];
  </script>

</body>
</html>
