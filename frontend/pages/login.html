<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediBook – Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <!-- ═══════════════ NAVBAR ═══════════════ -->
  <nav>
    <a class="logo" href="index.html">
      <div class="logo-icon">+</div>
      MediBook
    </a>
    <div class="nav-links">
      <button class="toggle-btn" id="darkToggle" title="Toggle dark mode">🌙</button>
      <div id="guestNav" style="display:flex; gap:8px;">
        <a href="login.html"    class="nav-btn primary">Sign In</a>
        <a href="register.html" class="nav-btn">Register</a>
      </div>
      <div id="userNav" style="display:none; align-items:center; gap:10px;">
        <a href="index.html"        class="nav-btn">Find Doctors</a>
        <a href="appointments.html" class="nav-btn">My Appointments</a>
        <div class="user-menu">
          <div class="user-avatar" id="userAvatarBtn" onclick="toggleDropdown()">JD</div>
          <div class="user-dropdown" id="userDropdown">
            <a href="appointments.html" class="dd-item">📅 Appointments</a>
            <div class="dd-item danger" onclick="signOut()">🚪 Sign Out</div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ═══════════════ LOGIN FORM ════════════ -->
  <div class="auth-page">
    <div class="form-wrap">

      <div class="form-title">
        <span class="form-logo">👨‍⚕️</span>
        <h2>Welcome Back</h2>
        <p>Sign in to your MediBook account</p>
      </div>

      <!-- Alert Box -->
      <div class="alert" id="loginAlert"></div>

      <!-- Social Login (decorative) -->
      <div class="social-btns">
        <button class="social-btn" onclick="showToast('Social login coming soon!', '🔧')">
          <span>🌐</span> Google
        </button>
        <button class="social-btn" onclick="showToast('Social login coming soon!', '🔧')">
          <span>🍎</span> Apple
        </button>
      </div>

      <div class="or-divider">or sign in with email</div>

      <!-- Login Form -->
      <form onsubmit="doLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPass">Password</label>
          <input
            type="password"
            id="loginPass"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="forgot-link">
          <a href="#" onclick="showToast('Password reset coming soon!', '📧')">Forgot password?</a>
        </div>

        <button type="submit" class="btn full">Sign In</button>
      </form>

      <hr class="divider" />

      <div class="form-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
      <div class="form-switch mt-8">
        <a href="index.html">← Back to Home</a>
      </div>

    </div>
  </div>

  <!-- ═══════════════ TOAST ══════════════════ -->
  <div class="toast" id="toast"></div>

  <!-- ═══════════════ SCRIPTS ═══════════════ -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
